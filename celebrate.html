<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’ve been gifted a placeholder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bg2:#0a0803; --ink:#efe6c8; --muted:#b9ad84;
  --g1:#8a6a1c; --g2:#d4af37; --g3:#f6e7a6; --g4:#fff6cf;
  --foil:linear-gradient(100deg,var(--g1) 0%,var(--g2) 22%,var(--g4) 40%,var(--g2) 58%,var(--g1) 80%,var(--g3) 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg) 70%);
  color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
.card{
  position:relative;width:min(560px,100%);padding:56px 36px 48px;text-align:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--bg2) 92%,#000),var(--bg));
  border:1px solid var(--g2);
  outline:1px solid var(--g1);outline-offset:-12px;
  box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--g1),0 30px 80px rgba(0,0,0,.45),0 0 60px rgba(212,175,55,.12);
}
.card::before,.card::after{
  content:"";position:absolute;width:46px;height:46px;border:2px solid var(--g2);
}
.card::before{top:-8px;left:-8px;border-right:0;border-bottom:0}
.card::after{bottom:-8px;right:-8px;border-left:0;border-top:0}
.flourish{display:block;width:min(300px,80%);height:auto;margin:20px auto;color:var(--g2);filter:drop-shadow(0 0 6px rgba(212,175,55,.55))}
.flourish.small{width:min(200px,60%);margin:26px auto 0;opacity:.9}
.seal{width:84px;height:84px;margin:0 auto 22px;display:block;filter:drop-shadow(0 4px 10px rgba(212,175,55,.35))}
.lead{
  margin:0;font-size:clamp(1.5rem,5.5vw,2rem);font-style:italic;letter-spacing:.04em;color:var(--muted);
}
.gift{
  margin:0;font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;
  font-size:clamp(3.6rem,17vw,6.4rem);line-height:1.1;padding:.1em .15em;
  background:var(--foil);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 14px rgba(212,175,55,.35));
  animation:sheen 3.2s .4s ease-out both;
}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
.note{margin:18px auto 0;max-width:30ch;font-size:1.2rem;line-height:1.55;color:var(--muted)}
.btn{
  margin-top:30px;padding:13px 34px;font:inherit;font-size:1.15rem;letter-spacing:.08em;cursor:pointer;
  color:#2a1f05;border:0;background:var(--foil);background-size:200% 100%;
  box-shadow:0 6px 20px rgba(212,175,55,.3);transition:background-position .6s,transform .2s;
}
.btn:hover{background-position:100% 0}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--g3);outline-offset:4px}
.thanks{min-height:1.6em;margin:16px 0 0;font-style:italic;color:var(--g2)}
.snd{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;padding:8px 16px;font:inherit;font-size:1rem;letter-spacing:.05em;cursor:pointer;color:var(--g3);background:rgba(0,0,0,.6);border:1px solid var(--g2)}
.snd:focus-visible{outline:2px solid var(--g3);outline-offset:3px}
.snd[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.gift{animation:none;background-position:0 0}.btn{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="half" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M150 18C142 18 138 8 128 8C119 8 116 17 123 19C129 20 131 12 126 11"/>
      <path d="M138 20C126 31 112 26 98 22C84 18 72 13 56 18C44 21 36 27 22 24C14 22 8 20 4 15"/>
      <path d="M132 16C120 14 112 10 100 12C92 13 86 9 78 8"/>
      <circle cx="4" cy="15" r="1.8" fill="currentColor"/>
    </g>
    <symbol id="swirl" viewBox="0 0 300 36">
      <use href="#half"/>
      <use href="#half" transform="translate(300 0) scale(-1 1)"/>
      <path d="M150 12l5 6-5 6-5-6z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
<main class="card">
  <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff6cf"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5a12"/>
      </linearGradient>
    </defs>
    <path d="M50 4l8 8 11-3 5 10 11 1 1 11 10 5-3 11 8 8-8 8 3 11-10 5-1 11-11 1-5 10-11-3-8 8-8-8-11 3-5-10-11-1-1-11-10-5 3-11-8-8 8-8-3-11 10-5 1-11 11-1 5-10 11 3z" fill="url(#sg)"/>
    <circle cx="50" cy="50" r="29" fill="none" stroke="#5c430c" stroke-width="1.5" opacity=".7"/>
    <path d="M50 30l5.6 12.6 13.7 1.3-10.3 9.1 3 13.4L50 59l-12 7.4 3-13.4-10.3-9.1 13.7-1.3z" fill="#5c430c" opacity=".85"/>
  </svg>
  <p class="lead">You’ve been gifted a</p>
  <svg class="flourish" viewBox="0 0 300 36" aria-hidden="true"><use href="#swirl"/></svg>
  <h1 class="gift">placeholder</h1>
  <p class="note">Wrapped in gold, and ready to be replaced with something wonderful.</p>
  <svg class="flourish small" viewBox="0 0 300 36" aria-hidden="true"><use href="#swirl"/></svg>
  <button class="btn" id="open" type="button">Accept gift</button>
  <p class="thanks" id="thanks" aria-live="polite"></p>
</main>
<audio id="song" src="celebrate.mp3" preload="auto"></audio>
<button class="snd" id="snd" type="button" aria-pressed="false">Sound off</button>
<script>
(function(){
  var song=document.getElementById('song'),snd=document.getElementById('snd'),muted=false;
  function ui(){var on=!song.paused;snd.textContent=on?'Sound on':'Sound off';snd.setAttribute('aria-pressed',on)}
  function play(){
    var p=song.play();
    if(p&&p.then){p.then(function(){ui();unbind()}).catch(function(){ui()})}
  }
  function unlock(e){
    if(e.target.closest&&e.target.closest('#snd'))return;
    if(!muted&&song.paused)play();
  }
  var evs=['pointerdown','keydown','touchstart'];
  evs.forEach(function(n){document.addEventListener(n,unlock)});
  function unbind(){evs.forEach(function(n){document.removeEventListener(n,unlock)})}
  song.addEventListener('error',function(){snd.hidden=true;unbind()});
  snd.addEventListener('click',function(){
    if(song.paused){muted=false;play()}else{muted=true;song.pause();ui()}
  });
  song.addEventListener('pause',ui);
  play(); // browsers may block this until the first tap or keypress
  document.getElementById('open').addEventListener('click',function(){
    document.getElementById('thanks').textContent='Gift accepted. Enjoy your placeholder.';
    this.disabled=true;this.style.opacity='.6';this.style.cursor='default';
    if(!muted&&song.paused)play();
  });
})();
</script>
</body>
</html>
