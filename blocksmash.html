<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Block Smash</title></head><body>
<script src="arcade.js"></script>
<script>
const A=Arcade.mount({id:'smash',title:'BLOCK SMASH',w:400,h:620,pad:'',help:'DRAG PIECES ONTO THE GRID · KEYS: ARROWS MOVE, Z PICK PIECE, SPACE PLACE',init:reset});
const c=A.ctx,P=[],K=['#f55','#fa3','#ff4','#5f5','#4cf','#a6f','#f6c'],O=16,Y=60,Z=46;
'1,11,111,1111,11111,11/11,111/111/111,111/111,11/10,111/100/100,111/010,110/011,10/11/10'.split(',').forEach(s=>{
  let m=s.split('/').map(r=>[...r].map(Number));
  for(let k=0;k<4;k++){const j=JSON.stringify(m);if(!P.some(q=>JSON.stringify(q.m)==j))P.push({m,k:P.length%7});m=m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
});
let g,tray,sc,st,drag,sel,cur,kb,end;
const fits=(m,x,y)=>m.every((r,j)=>r.every((v,i)=>!v||x+i>=0&&x+i<8&&y+j>=0&&y+j<8&&!g[y+j][x+i])),
any=m=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(fits(m,x,y))return 1},
deal=()=>{for(let n=0;n<30;n++){tray=[0,1,2].map(()=>P[Math.random()*P.length|0]);if(tray.some(p=>any(p.m)))break}},
snap=d=>{const m=tray[d.i].m;return{x:Math.round((d.x-m[0].length*Z/2-O)/Z),y:Math.round((d.y-70-m.length*Z/2-Y)/Z)}};
function reset(){g=Array.from({length:8},()=>Array(8).fill(0));sc=st=sel=0;end=0;drag=null;kb=0;cur={x:3,y:3};deal();A.run(draw)}
function place(i,x,y){
  const p=tray[i];p.m.forEach((r,j)=>r.forEach((v,k)=>v&&(g[y+j][x+k]=p.k+1)));
  sc+=p.m.flat().filter(Boolean).length;tray[i]=null;
  const R=[],C=[];for(let k=0;k<8;k++){if(g[k].every(Boolean))R.push(k);if(g.every(r=>r[k]))C.push(k)}
  const n=R.length+C.length;
  if(n){sc+=n*n*10*(1+st);st++;R.forEach(r=>g[r].fill(0));C.forEach(k=>g.forEach(r=>r[k]=0))}else st=0;
  if(!tray.some(Boolean))deal();
  sel=Math.max(0,tray.findIndex(Boolean));
  if(!tray.some(p=>p&&any(p.m))){end=1;draw();A.over(sc)}
}
const pos=e=>{const r=A.c.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*620/r.height}};
A.c.onpointerdown=e=>{kb=0;const q=pos(e),i=q.x/133.4|0;if(!end&&q.y>440&&tray[i]){drag={i,...q};sel=i;A.c.setPointerCapture(e.pointerId)}};
A.c.onpointermove=e=>{if(drag)Object.assign(drag,pos(e))};
A.c.onpointerup=A.c.onpointercancel=()=>{if(drag){const s=snap(drag),i=drag.i;drag=null;if(fits(tray[i].m,s.x,s.y))place(i,s.x,s.y)}};
A.press('L',()=>{kb=1;cur.x=Math.max(0,cur.x-1)},120);
A.press('R',()=>{kb=1;cur.x=Math.min(7,cur.x+1)},120);
A.press('U',()=>{kb=1;cur.y=Math.max(0,cur.y-1)},120);
A.press('D',()=>{kb=1;cur.y=Math.min(7,cur.y+1)},120);
A.press('B',()=>{kb=1;for(let k=1;k<=3;k++){const i=(sel+k)%3;if(tray[i]){sel=i;break}}});
A.press('A',()=>{kb=1;if(!end&&tray[sel]&&fits(tray[sel].m,cur.x,cur.y))place(sel,cur.x,cur.y)});
const blk=(x,y,s,col,a)=>{c.globalAlpha=a||1;c.fillStyle=col;c.fillRect(x+1,y+1,s-2,s-2);c.fillStyle='rgba(255,255,255,.3)';c.fillRect(x+1,y+1,s-2,4);c.globalAlpha=1},
shape=(m,x,y,s,col,a)=>m.forEach((r,j)=>r.forEach((v,i)=>v&&blk(x+i*s,y+j*s,s,col,a)));
function draw(){
  c.fillStyle='#07040f';c.fillRect(0,0,400,620);
  c.font='14px "Press Start 2P",monospace';c.fillStyle='#ff0';c.fillText('SCORE '+sc,16,36);
  if(st>1){c.fillStyle='#f0f';c.fillText('x'+st,330,36)}
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    if(g[y][x])blk(O+x*Z,Y+y*Z,Z,K[g[y][x]-1]);else{c.fillStyle='#14102a';c.fillRect(O+x*Z+1,Y+y*Z+1,Z-2,Z-2)}
  }
  let gp=null;
  if(drag){const s=snap(drag);if(fits(tray[drag.i].m,s.x,s.y))gp={...s,i:drag.i}}
  else if(kb&&tray[sel]&&fits(tray[sel].m,cur.x,cur.y))gp={...cur,i:sel};
  if(kb&&!drag){c.strokeStyle='#fff';c.strokeRect(O+cur.x*Z,Y+cur.y*Z,Z,Z)}
  if(gp)shape(tray[gp.i].m,O+gp.x*Z,Y+gp.y*Z,Z,K[tray[gp.i].k],.35);
  tray.forEach((p,i)=>{
    if(!p||drag&&drag.i==i)return;const s=24;
    if(i==sel&&kb){c.strokeStyle='#0ff';c.strokeRect(i*133+8,452,117,150)}
    shape(p.m,66.7+133.3*i-p.m[0].length*s/2,530-p.m.length*s/2,s,K[p.k]);
  });
  if(drag){const m=tray[drag.i].m;shape(m,drag.x-m[0].length*Z/2,drag.y-70-m.length*Z/2,Z,K[tray[drag.i].k],.9)}
}
A.start();
</script></body></html>
