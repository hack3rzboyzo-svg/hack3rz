<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hell Corridor</title></head><body>
<script src="sfx.js"></script>
<script src="arcade.js"></script>
<script>
const A=Arcade.mount({id:'hell',title:'HELL CORRIDOR',w:320,h:200,px:1,pad:'LRUDAB',help:'↑↓ MOVE · ←→ TURN · HOLD Z + ←→ STRAFE · SPACE OR CLICK TO FIRE',init:reset});
const c=A.ctx,W=320,H=200,zb=[],
MP=['1111111111111111','1000000000000001','1022200000033001','1000000000000001','1000000110000001','1000000110000201','1030000000000001','1000000000000001','1000220000000001','1000000000330001','1000000000000001','1002000110000001','1000000110000301','1000000000000001','1000000000000001','1111111111111111'].map(r=>[...r].map(Number)),
WC=[0,[230,40,180],[40,200,230],[150,80,255]],
cell=(x,y)=>(MP[y|0]||[])[x|0];
let px,py,a,hp,sc,kills,en,cd,fl,hu,sp,dead,tm;
function reset(){px=py=1.5;a=.15;hp=100;sc=kills=0;en=[];cd=fl=hu=sp=0;dead=0;tm=0;SFX.play('start');A.run(tick)}
const mv=(x,y)=>{if(!cell(px+x+Math.sign(x)*.25,py))px+=x;if(!cell(px,py+y+Math.sign(y)*.25))py+=y};
function fire(){
  if(dead||cd>0)return;cd=.45;fl=.1;SFX.play('shotgun');
  const dx=Math.cos(a),dy=Math.sin(a);let b=null;
  for(const e of en){
    const rx=e.x-px,ry=e.y-py,f=rx*dx+ry*dy,s=Math.abs(-rx*dy+ry*dx);
    if(f>0&&s<.35&&f<(zb[W/2]||99)&&(!b||f<b.f))b={e,f};
  }
  if(b){
    b.e.hp-=b.f<4?2:1;b.e.hit=.1;SFX.play('hit');
    if(b.e.hp<=0){en.splice(en.indexOf(b.e),1);sc+=100*(1+(kills/10|0));kills++;SFX.play('kill')}
  }
}
A.press('A',fire,100);
A.c.onpointerdown=e=>{e.preventDefault();fire()};
function tick(dt){
  dt/=1000;tm+=dt;cd-=dt;fl-=dt;hu-=dt;
  const h=A.held,dx=Math.cos(a),dy=Math.sin(a),t=((h.R|0)-(h.L|0))*2.4*dt;
  if(h.B)mv(-dy*t,dx*t);else a+=t;
  const f=((h.U|0)-(h.D|0))*3*dt;mv(dx*f,dy*f);
  const wave=kills/10|0;
  sp-=dt;
  if(sp<=0&&en.length<5+wave){
    sp=Math.max(.7,3-wave*.2);let x,y,n=0;
    do{x=1+Math.random()*14|0;y=1+Math.random()*14|0;n++}while((cell(x,y)||Math.hypot(x+.5-px,y+.5-py)<5)&&n<50);
    if(!cell(x,y)){en.push({x:x+.5,y:y+.5,hp:2,hit:0});SFX.play('spawn')}
  }
  en.forEach(e=>{
    e.hit-=dt;
    const rx=px-e.x,ry=py-e.y,d=Math.hypot(rx,ry),s=Math.min(2.4,1+wave*.12)*dt;
    if(d>.7){const ux=rx/d*s,uy=ry/d*s;if(!cell(e.x+ux*3,e.y))e.x+=ux;if(!cell(e.x,e.y+uy*3))e.y+=uy}
    else{hp-=14*dt;if(hu<=0)SFX.play('hurt');hu=.25}
  });
  if(hp<=0&&!dead){dead=1;render();A.over(sc);return}
  render();
}
function render(){
  c.fillStyle='#1a0640';c.fillRect(0,0,W,H/2);c.fillStyle='#0d0220';c.fillRect(0,H/2,W,H/2);
  const dx=Math.cos(a),dy=Math.sin(a),pX=-dy*.66,pY=dx*.66;
  for(let x=0;x<W;x++){
    const k=2*x/W-1,rx=dx+pX*k,ry=dy+pY*k;
    let mx=px|0,my=py|0,sx,sy,sdx,sdy,side=0,hit=0;
    const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    if(rx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}
    if(ry<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
    while(!hit){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}hit=cell(mx,my)||0;if(mx<0||my<0||mx>15||my>15)hit=1}
    const pd=side?sdy-ddy:sdx-ddx;zb[x]=pd;
    const lh=H/pd,wx=(side?px+pd*rx:py+pd*ry)%1,col=WC[hit]||WC[1],sh=(side?.65:1)/(1+pd*.22)*((wx*5%1)<.07?.5:1);
    c.fillStyle=`rgb(${col[0]*sh|0},${col[1]*sh|0},${col[2]*sh|0})`;c.fillRect(x,(H-lh)/2,1,lh);
  }
  const inv=1/(pX*dy-dx*pY);
  [...en].sort((p,q)=>Math.hypot(q.x-px,q.y-py)-Math.hypot(p.x-px,p.y-py)).forEach(e=>{
    const sx=e.x-px,sy=e.y-py,tx=inv*(dy*sx-dx*sy),ty=inv*(-pY*sx+pX*sy);
    if(ty<.2)return;
    const scr=W/2*(1+tx/ty),sz=H/ty|0;
    for(let u=0;u<sz;u++){
      const X=(scr-sz/2+u)|0;if(X<0||X>=W||ty>=zb[X])continue;
      const f=u/sz,h=Math.sqrt(Math.max(0,1-((f-.5)/.5)**2));if(h<.2)continue;
      const y0=H/2-sz*.4*h,y1=H/2+sz*.5;
      c.fillStyle=e.hit>0?'#fff':`rgb(${200/(1+ty*.2)|0},40,30)`;c.fillRect(X,y0,1,y1-y0);
      if(Math.abs(f-.35)<.05||Math.abs(f-.65)<.05){c.fillStyle='#ff0';c.fillRect(X,H/2-sz*.15,1,Math.max(1,sz*.07))}
    }
  });
  const bob=Math.sin(tm*8)*((A.held.U|A.held.D)?3:0),rc=fl>0?8:0;
  c.fillStyle='#444';c.fillRect(W/2-8,H-46+bob+rc,16,46);
  c.fillStyle='#777';c.fillRect(W/2-5,H-52+bob+rc,10,10);
  c.fillStyle='#8a5a2b';c.fillRect(W/2-14,H-18+bob+rc,28,18);
  if(fl>0){c.fillStyle='#ff0';c.beginPath();c.moveTo(W/2-12,H-52);c.lineTo(W/2,H-80);c.lineTo(W/2+12,H-52);c.fill()}
  c.fillStyle='#fff';c.fillRect(W/2-1,H/2-4,2,8);c.fillRect(W/2-4,H/2-1,8,2);
  if(hu>0){c.fillStyle=`rgba(255,0,0,${hu*1.5})`;c.fillRect(0,0,W,H)}
  c.font='8px "Press Start 2P",monospace';c.fillStyle='#000';c.fillRect(0,0,W,12);
  c.fillStyle='#ff0';c.fillText('SCORE '+sc,4,9);
  c.fillStyle='#f33';c.fillRect(W-104,2,Math.max(0,hp),8);c.strokeStyle='#fff';c.strokeRect(W-104,2,100,8);
}
A.start();
</script></body></html>
