<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Maze Chase</title></head><body>
<script src="sfx.js"></script>
<script src="arcade.js"></script>
<script>
const A=Arcade.mount({id:'chase',title:'MAZE CHASE',w:630,h:450,pad:'LRUDA',help:'ARROWS / WASD MOVE · SPACE SHOOTS (AUTO-AIMS) · GRAB ALL ORBS, THEN RUN FOR THE EXIT',init:reset});
const c=A.ctx,T=30,C=21,R=15,W=630,H=450,D4=[[1,0],[-1,0],[0,1],[0,-1]];
let g,p,m,orbs=[],pk=[],ex,bl=[],lvl,sc,ammo,got,need,cd=0,tm=0,lt=0,grace=0,al=0,over=1;
function gen(){
  const q=Array.from({length:R},()=>Array(C).fill(1)),st=[[1,1]];q[1][1]=0;
  while(st.length){
    const[x,y]=st[st.length-1],n=D4.map(([a,b])=>[a*2,b*2]).filter(([a,b])=>x+a>0&&x+a<C-1&&y+b>0&&y+b<R-1&&q[y+b][x+a]).sort(()=>Math.random()-.5);
    if(!n.length){st.pop();continue}
    const[a,b]=n[0];q[y+b/2][x+a/2]=0;q[y+b][x+a]=0;st.push([x+a,y+b]);
  }
  for(let i=0;i<14;i++){const x=1+Math.random()*(C-2)|0,y=1+Math.random()*(R-2)|0;if(q[y][x]&&((!q[y][x-1]&&!q[y][x+1])||(!q[y-1][x]&&!q[y+1][x])))q[y][x]=0}
  return q}
const bfs=(tx,ty)=>{const d=Array.from({length:R},()=>Array(C).fill(-1)),q=[[tx,ty]];d[ty][tx]=0;
  for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,b]of D4){const nx=x+a,ny=y+b;if(g[ny]&&g[ny][nx]===0&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}}return d},
sight=(a,b)=>{const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/8);for(let i=1;i<n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;if(g[y/T|0][x/T|0])return 0}return 1};
function wall(e){const cx=e.x/T|0,cy=e.y/T|0;
  for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){
    if(g[y]&&g[y][x]===0)continue;
    const rx=x*T,ry=y*T,nx=Math.max(rx,Math.min(e.x,rx+T)),ny=Math.max(ry,Math.min(e.y,ry+T)),dx=e.x-nx,dy=e.y-ny,d2=dx*dx+dy*dy;
    if(d2>0&&d2<e.r*e.r){const d=Math.sqrt(d2),k=(e.r-d)/d;e.x+=dx*k;e.y+=dy*k}}}
function level(){
  g=gen();const fl=[];for(let y=1;y<R-1;y++)for(let x=1;x<C-1;x++)if(!g[y][x])fl.push([x,y]);
  p={x:T*1.5,y:T*1.5,r:9,a:0};const d0=bfs(1,1);
  const far=fl.slice().sort((a,b)=>d0[b[1]][b[0]]-d0[a[1]][a[0]]);
  ex=far[0];const mt=far[1+(Math.random()*fl.length/4|0)];
  m={x:(mt[0]+.5)*T,y:(mt[1]+.5)*T,r:13,st:0,vx:0,vy:0};
  const free=fl.filter(([x,y])=>d0[y][x]>4&&!(x==ex[0]&&y==ex[1])&&!(x==mt[0]&&y==mt[1])).sort(()=>Math.random()-.5),pt=([x,y])=>({x:(x+.5)*T,y:(y+.5)*T});
  need=Math.min(9,3+lvl);got=0;orbs=free.slice(0,need).map(pt);pk=free.slice(need,need+2).map(pt);
  bl=[];grace=3;lt=0;cd=0}
function reset(){lvl=1;sc=0;ammo=3;tm=0;over=0;al=0;level();SFX.play('start');A.run(tick)}
function shoot(){
  if(over||ammo<=0||cd>0)return;let a=p.a;
  if(sight(p,m)){const t=Math.hypot(m.x-p.x,m.y-p.y)/420;a=Math.atan2(m.y+m.vy*t-p.y,m.x+m.vx*t-p.x)}
  p.a=a;cd=.25;ammo--;bl.push({x:p.x,y:p.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,l:1.3});SFX.play('shotgun')}
A.press('A',shoot,180);
function tick(dt){
  dt/=1000;tm+=dt;lt+=dt;cd-=dt;grace-=dt;
  const h=A.held,dx=(h.R|0)-(h.L|0),dy=(h.D|0)-(h.U|0),l=Math.hypot(dx,dy);
  if(l){p.a=Math.atan2(dy,dx);p.x+=dx/l*115*dt;p.y+=dy/l*115*dt;wall(p)}
  const d=bfs(p.x/T|0,p.y/T|0);m.st=Math.max(0,m.st-dt);
  if(grace>0){m.vx=m.vy=0}
  else{
    const dm0=Math.hypot(p.x-m.x,p.y-m.y),sp=m.st>0?0:Math.min(128,62+lvl*8)*(dm0>270?1.25:1);
    let tx=p.x,ty=p.y;
    if(!(sight(m,p)&&dm0<260)){
      const mx=m.x/T|0,my=m.y/T|0;let b=(d[my]||[])[mx];if(!(b>=0))b=1e9;let bt=null;
      for(const[a,e]of D4){const nx=mx+a,ny=my+e;if(g[ny]&&g[ny][nx]===0&&d[ny][nx]>=0&&d[ny][nx]<b){b=d[ny][nx];bt=[nx,ny]}}
      if(bt){tx=(bt[0]+.5)*T;ty=(bt[1]+.5)*T}}
    const ang=Math.atan2(ty-m.y,tx-m.x),ox=m.x,oy=m.y;
    m.x+=Math.cos(ang)*sp*dt;m.y+=Math.sin(ang)*sp*dt;wall(m);m.vx=(m.x-ox)/dt;m.vy=(m.y-oy)/dt}
  const dm=Math.hypot(p.x-m.x,p.y-m.y);
  if(dm<m.r+p.r-3){over=1;render();A.over(sc);return}
  if(dm<120&&grace<=0&&m.st<=0&&(al-=dt)<=0){SFX.play('hurt');al=.8}
  bl=bl.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if((b.l-=dt)<=0||g[b.y/T|0][b.x/T|0])return 0;
    if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+3){m.st=Math.min(3.5,m.st+2);sc+=25;SFX.play('hit');m.x+=b.vx*.02;m.y+=b.vy*.02;wall(m);return 0}return 1});
  orbs=orbs.filter(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)<16){got++;sc+=100;SFX.play('waka');return 0}return 1});
  pk=pk.filter(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)<16){ammo=Math.min(9,ammo+2);SFX.play('power');return 0}return 1});
  if(got>=need&&Math.hypot((ex[0]+.5)*T-p.x,(ex[1]+.5)*T-p.y)<16){sc+=300+Math.max(0,60-lt|0)*10;lvl++;ammo=Math.min(9,ammo+1);SFX.play('levelup');level()}
  render()}
function render(){
  c.fillStyle='#0a0221';c.fillRect(0,0,W,H);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){const X=x*T,Y=y*T;
    if(g[y][x]){c.fillStyle='#2a1060';c.fillRect(X,Y,T,T);c.fillStyle='#8a2cff';c.fillRect(X,Y,T,2);c.fillStyle='#1a0840';c.fillRect(X+3,Y+5,T-6,T-8)}
    else if((x+y)%2){c.fillStyle='#10063a';c.fillRect(X,Y,T,T)}}
  const op=got>=need,EX=(ex[0]+.5)*T,EY=(ex[1]+.5)*T;
  c.fillStyle=op?'#39ff88':'#44335c';c.fillRect(ex[0]*T+4,ex[1]*T+4,T-8,T-8);
  c.shadowColor='#ffe066';c.shadowBlur=10;c.fillStyle='#ffe066';
  orbs.forEach(o=>{c.beginPath();c.arc(o.x,o.y,5+Math.sin(tm*6)*1.2,0,7);c.fill()});
  c.shadowColor='#0ff';c.fillStyle='#0ff';pk.forEach(o=>c.fillRect(o.x-5,o.y-5,10,10));c.shadowBlur=0;
  c.strokeStyle='#ff0';c.lineWidth=3;c.lineCap='round';
  bl.forEach(b=>{c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);c.stroke()});
  const sh=m.st>0?(Math.random()-.5)*4:0;
  c.fillStyle=m.st>0?'#3b4cff':'#7a0f26';c.beginPath();c.arc(m.x+sh,m.y,m.r,0,7);c.fill();
  c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(p.a)*(p.r+7),p.y+Math.sin(p.a)*(p.r+7));c.stroke();
  c.fillStyle='#39ff88';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();
  const gr=c.createRadialGradient(p.x,p.y,30,p.x,p.y,175+Math.sin(tm*23)*3);
  gr.addColorStop(0,'rgba(5,1,15,0)');gr.addColorStop(1,'rgba(5,1,15,.94)');c.fillStyle=gr;c.fillRect(0,0,W,H);
  const ha=Math.atan2(p.y-m.y,p.x-m.x),dm=Math.hypot(p.x-m.x,p.y-m.y);
  c.shadowBlur=12;c.shadowColor=c.fillStyle=m.st>0?'#58f':'#f22';
  [-1,1].forEach(s=>{c.beginPath();c.arc(m.x+sh+Math.cos(ha)*6-Math.sin(ha)*5*s,m.y+Math.sin(ha)*6+Math.cos(ha)*5*s,2.6,0,7);c.fill()});c.shadowBlur=0;
  if(op){c.strokeStyle='#39ff88';c.lineWidth=2;c.beginPath();c.arc(EX,EY,10+Math.sin(tm*5)*3,0,7);c.stroke()}
  if(dm<120){c.fillStyle='rgba(255,0,40,'+.25*(1-dm/120)+')';c.fillRect(0,0,W,H)}
  c.font='10px "Press Start 2P",monospace';c.fillStyle='rgba(0,0,0,.65)';c.fillRect(0,0,W,16);
  c.fillStyle='#ff0';c.fillText('SCORE '+sc,6,12);c.fillStyle='#0ff';c.fillText('LV '+lvl,200,12);
  c.fillStyle='#ffe066';c.fillText('ORBS '+got+'/'+need,290,12);c.fillStyle=ammo?'#fff':'#f33';c.fillText('AMMO '+ammo,450,12);
  if(grace>0){c.fillStyle='#f33';c.fillText('IT WAKES IN '+Math.ceil(grace),240,H-10)}}
A.start();
</script></body></html>
